# cli の検証（型検査 / 生成型の差分 / テスト）を Forgejo Actions で回す。
#
# GitHub 側（.github/workflows/cli-test.yml）と同じ内容。
# apps/cli/src/api/openapi.d.ts は apps/frontend/openapi.json から生成した
# コミット対象なので、生成し直して差分が出ないことも見る。

name: CLI

on:
  push:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - 'apps/frontend/openapi.json'
      - '.forgejo/workflows/cli.yml'
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'apps/frontend/openapi.json'
      - '.forgejo/workflows/cli.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: docker
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/cli/package.json

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
        working-directory: apps/cli

      - name: Cache pnpm store
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: forgejo-pnpm-cli-${{ runner.os }}-${{ hashFiles('apps/cli/pnpm-lock.yaml') }}
          restore-keys: |
            forgejo-pnpm-cli-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/cli

      - name: Generate CLI OpenAPI types
        run: pnpm openapi:generate
        working-directory: apps/cli

      - name: Type-check CLI application
        run: pnpm build
        working-directory: apps/cli

      - name: Type-check contract tests
        run: pnpm typecheck:test
        working-directory: apps/cli

      - name: Check generated CLI OpenAPI type drift
        run: |
          set -euo pipefail
          if git diff --quiet -- src/api/openapi.d.ts; then
            echo "CLI OpenAPI types are in sync."
            exit 0
          fi

          echo "apps/cli/src/api/openapi.d.ts is out of sync with apps/frontend/openapi.json." >&2
          echo "" >&2
          echo "After changing the API surface, regenerate and commit the CLI types:" >&2
          echo "  cd apps/cli && pnpm openapi:generate" >&2
          echo "  git add apps/cli/src/api/openapi.d.ts" >&2
          echo "" >&2
          echo "Diff:" >&2
          git diff -- src/api/openapi.d.ts | head -200 || true
          exit 1
        working-directory: apps/cli

      - name: Run tests
        run: pnpm test
        working-directory: apps/cli
