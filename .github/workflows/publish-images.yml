name: Publish Images

# v* のタグを push したときだけ、配布用イメージ（Dockerfile の production ステージ）を
# ghcr.io へ公開する。main への push では動かない。
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # リリースのビルドは途中で打ち切らない
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign の keyless 署名が OIDC トークンを使う。publish ジョブだけに絞る
      id-token: write

    strategy:
      # 片方が失敗しても、もう片方のイメージは公開まで進める
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: apps/backend
            dockerfile: apps/backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: apps/frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # push したイメージの digest へ keyless 署名する。tag は動かせるが digest は
      # 中身そのものを指すので、署名は tag ではなく digest に付ける
      - name: Sign the image
        run: |
          set -euo pipefail
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}"

      # 署名したその場で検める（検証の通らぬ署名を残さない）。
      # 身元は「この repo のこの workflow が、タグから走った」ことまで縛る
      - name: Verify the signature
        run: |
          set -euo pipefail
          cosign verify \
            "ghcr.io/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp '^https://github\.com/koyori-app/task/\.github/workflows/publish-images\.yml@refs/tags/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
