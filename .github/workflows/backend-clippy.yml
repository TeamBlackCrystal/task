name: Backend Clippy Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/backend-clippy.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/backend-clippy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # toolchain は rust-toolchain.toml に一本化する（components もそこで指定済み）。
      # 引数なしの install が「アクティブな toolchain」= rust-toolchain.toml を読む。
      - name: Install Rust
        run: rustup toolchain install

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/backend -> target
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: apps/backend
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
