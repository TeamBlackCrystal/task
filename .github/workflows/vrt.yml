# VRT (Visual Regression Testing) ワークフロー
#
# apps/frontend の Storybook をビルドし、VRT (https://vrt.koyori.app) に
# アップロードして baseline スナップショットと比較する。
# 差分があると VRT 側で検出され、UI 上でレビューできる。
#
# 必要なシークレット:
#   VRT_TOKEN
#     VRT の UI の Settings -> Personal access tokens で発行する。
#     スコープは `write:build` と `read:build` の両方が必要。
#     (アップロードに write:build、結果を待つために read:build が要る)
#     トークンは vrt-actions 側でログに出さない実装になっている。

name: VRT

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/frontend/**
      - .github/workflows/vrt.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vrt:
    # fork 由来の PR には repository secret (VRT_TOKEN) が渡らないため、
    # 実行しても必ず失敗する。fork PR ではジョブごと skip する。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # task リポジトリを checkout。
      #
      # fetch-depth: 0 は VRT の `--only-changed` が baseline コミットまでの
      # git 履歴を辿って差分撮影を判定するために必須。shallow clone だと
      # 履歴が足りず全撮影にフォールバックしてしまう。
      #
      # ref に PR の head コミットを明示するのは 2 つの理由から:
      #   1. 既定では pull_request イベントで「main へのマージコミット」が
      #      checkout される。CLI の差分は `git diff <baseline> HEAD` なので、
      #      マージコミットのままだと main 側の変更まで差分に混ざる。
      #   2. VRT に記録される commit SHA は GitHub App がコミットステータスを
      #      貼る先になる。マージコミットは GitHub 上に残らないため、
      #      PR ブランチに実在する head SHA でなければステータスを貼れない。
      # push イベントでは pull_request コンテキストが空なので github.sha に落ちる。
      - name: Checkout task
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      # --stats-json を付けると storybook build が preview-stats.json を出力する。
      # VRT の `--only-changed` はこの preview-stats.json を使って変更された
      # ストーリーだけを撮影対象に絞るため、これが無いと --only-changed が効かない。
      - name: Build Storybook
        run: pnpm build-storybook --stats-json
        working-directory: apps/frontend

      # vrt-actions で Storybook を VRT にアップロードする。
      # only-changed: preview-stats.json + git 履歴から変更分だけ撮影
      #   (baseline 未存在・package.json/lockfile 変更・.storybook/ 配下変更などは
      #    自動的に全撮影へ安全側フォールバックする)
      # wait: 比較完了まで待ち、結果を終了コードで返す
      #   passed=0 / changes_detected=1 / failed=2
      # branch と commit は vrt-actions が PR の head 情報を優先して解決する。
      - name: Upload to VRT
        uses: koyori-app/vrt-actions@ca529f2000f543930dda075f0a7501eeb56d1a1e # main @ 2026-08-26
        with:
          token: ${{ secrets.VRT_TOKEN }}
          project: koyori/task
          url: https://vrt.koyori.app/api
          mode: storybook
          dir: apps/frontend/storybook-static
          only-changed: true
          stats-json: apps/frontend/storybook-static/preview-stats.json
          wait: true
          # 差分あり (changes_detected) はこのジョブを赤にしない。
          # このジョブが表すのは「撮影と比較が問題なく走ったか」で、
          # 壊れたビルド (failed / rejected) は従来どおり赤のまま
          # (この設定は終了コード 2 には効かない)。
          #
          # 差分は人の承認待ちであって壊れてはいない。その通知は VRT 側の
          # commit status (context `vrt`) が 🟡 pending
          # 「N changes detected, awaiting review」で出し、PR コメントにも
          # レビュー UI へのリンクが載る——Actions の赤を本物の失敗だけに
          # 絞ることで、赤が常態化して本物の失敗を見落とすのを避ける。
          #
          # 「差分が残っているうちはマージさせない」まで求めるなら、
          # GitHub の ruleset で `vrt` を required status check にする
          # (承認すると status は 🟢 success に変わるので、そのまま門になる)。
          # 現状 main には branch protection / ruleset を掛けていないので、
          # この設定でゲートが緩むことはない。
          exit-zero-on-changes: true
          # 既定値 latest だと将来の CLI Release 公開で挙動が変わりうるため、
          # 動作確認済みのバージョンに固定する。更新は Action SHA と同様に明示的な PR で行う。
          cli-version: cli-v0.1.2
