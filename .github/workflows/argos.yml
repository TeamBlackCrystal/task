name: Argos Visual Testing

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: argos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  argos:
    runs-on: ubuntu-latest
    env:
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Select visual test scope
        id: selector
        working-directory: .
        run: node .github/scripts/argos-vrt-adapter.mts

      - name: Install Playwright browsers
        if: steps.selector.outputs.mode != 'NONE'
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve Storybook and capture every story
        if: steps.selector.outputs.mode != 'NONE'
        run: |
          pnpm exec http-server storybook-static --port 6006 --silent &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:6006/index.json > /dev/null && break
            if [ "$attempt" = 30 ]; then
              echo "Storybook did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          pnpm test-storybook --json --outputFile ../../.vrt/test-results.json
        env:
          ARGOS_ENABLED: "true"
          VRT_EVIDENCE_DIR: ../../.vrt

      - name: Verify exact capture manifest
        id: gate
        if: always() && steps.selector.outcome == 'success'
        working-directory: .
        run: node .github/scripts/argos-vrt-gate.mts

      - name: Upload screenshots to Argos
        if: >-
          steps.gate.outcome == 'success' &&
          steps.selector.outputs.mode != 'NONE' &&
          env.ARGOS_TOKEN != ''
        run: |
          upload_args=()
          if [ "${{ steps.selector.outputs.mode }}" = "PARTIAL" ]; then
            upload_args+=(--subset)
          fi
          pnpm exec argos upload screenshots "${upload_args[@]}"

      - name: Upload VRT selection evidence
        if: always() && steps.selector.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .vrt/
          if-no-files-found: error
