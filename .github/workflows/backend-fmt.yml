name: Backend Format Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      # CLI は同じ Cargo ワークスペースのメンバーなので --workspace の対象に入る
      - 'apps/cli/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/backend-fmt.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      # CLI は同じ Cargo ワークスペースのメンバーなので --workspace の対象に入る
      - 'apps/cli/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/backend-fmt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # toolchain は rust-toolchain.toml に一本化する（components もそこで指定済み）。
      # 引数なしの install が「アクティブな toolchain」= rust-toolchain.toml を読む。
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/backend -> target

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: apps/backend
