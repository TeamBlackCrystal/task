packages:
  - apps/frontend
  - packages/*
sharedWorkspaceLockfile: false
allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@sentry/cli': true
  esbuild: true
  vue-demi: true
catalog:
  '@codemirror/commands': 6.11.0
  '@codemirror/lang-markdown': 6.5.2
  '@codemirror/language': 6.12.4
  '@codemirror/state': 6.7.2
  '@codemirror/view': 6.43.10
  '@lezer/highlight': 1.2.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
minimumReleaseAgeExclude:
  - '@koyori-app/openapi-vue-query'
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
saveExact: true
catalogMode: prefer
